<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Em Iu ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 420px;
            width: 90%;
            z-index: 10;
            position: relative;
            backdrop-filter: blur(5px);
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            color: #ff3366;
            font-size: 2.8rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            color: #444;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }
        .btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-yes { background-color: #ff3366; color: white; z-index: 2; }
        .btn-yes:hover { background-color: #e60039; transform: scale(1.05); }
        .btn-no {
            background-color: #e0e0e0;
            color: #555;
            position: absolute;
            z-index: 3;
            left: 55%;
            top: 0;
            transition: all 0.2s ease;
        }
        .time-section { display: none; animation: fadeIn 0.5s ease-in-out; }
        .time-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .time-btn {
            background-color: #fff0f3;
            border: 2px solid #ffb6c1;
            padding: 12px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #d63384;
            cursor: pointer;
            transition: all 0.3s;
        }
        .time-btn:hover, .time-btn.selected {
            background-color: #ff3366;
            color: white;
            border-color: #ff3366;
            transform: scale(1.03);
        }
        .btn-submit {
            background-color: #28a745;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            display: none;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }
        .btn-submit:hover { background-color: #218838; }
        .success-screen { display: none; animation: fadeIn 0.5s ease-in-out; }
        .success-screen h1 { color: #28a745; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .heart {
            position: absolute;
            color: #ff3366;
            font-size: 20px;
            animation: flyUp 4s linear infinite;
            z-index: 1;
            opacity: 0.7;
        }
        @keyframes flyUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Màn hình 1 -->
        <div id="step-1">
            <h1>Gửi em iu của anh! ❤️</h1>
            <p>Chủ Nhật tuần này em có rảnh không, đi chơi với anh nha? 🥰</p>
            <div class="btn-group" id="btnGroup">
                <button class="btn btn-yes" id="btnYes">Có chứ ạ! ✨</button>
                <button class="btn btn-no" id="btnNo">Không đâu 😜</button>
            </div>
        </div>

        <!-- Màn hình 2 -->
        <div id="step-2" class="time-section">
            <h1>Tuyệt vời quá! 🥰</h1>
            <p>em iu hãy chọn khung giờ tụi mình xuất phát nhé</p>
            <div class="time-grid">
                <button class="time-btn" data-time="15:00 Chiều">15:00 Chiều</button>
                <button class="time-btn" data-time="16:00 Chiều">16:00 Chiều</button>
                <button class="time-btn" data-time="17:00 Chiều">17:00 Chiều</button>
                <button class="time-btn" data-time="18:00 Tối">18:00 Tối</button>
                <button class="time-btn" data-time="19:00 Tối">19:00 Tối</button>
            </div>
            <button class="btn-submit" id="btnSubmit">Xác nhận hẹn hò 💕</button>
        </div>

        <!-- Màn hình 3 -->
        <div id="step-3" class="success-screen">
            <h1>Đã chốt đơn! 🎉</h1>
            <p>Anh đã nhận được lịch hẹn của em rồi. Mong chờ được gặp em quá hihi! 💖🥰</p>
        </div>
    </div>

    <!-- Thư viện EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/index.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("cwglooaOGP43YAqbJ");
        })();
    </script>

    <script>
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const step3 = document.getElementById('step-3');
        const timeBtns = document.querySelectorAll('.time-btn');
        const btnSubmit = document.getElementById('btnSubmit');

        let selectedTime = '';

        function moveButton() {
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;
            const padding = 30;
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            let randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            let randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        btnNo.addEventListener('click', (e) => { e.preventDefault(); moveButton(); });
        btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); moveButton(); });

        btnYes.addEventListener('click', () => {
            step1.style.display = 'none';
            step2.style.display = 'block';
            createHearts();
        });

        timeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                timeBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedTime = btn.getAttribute('data-time');
                btnSubmit.style.display = 'block';
            });
        });

        btnSubmit.addEventListener('click', () => {
            if (!selectedTime) return;

            btnSubmit.innerHTML = "Đang gửi tín hiệu yêu thương... ❤️";
            btnSubmit.disabled = true;

            const templateParams = {
                time: selectedTime
            };

            let isFinished = false;

            // Đảm bảo sau tối đa 3 giây sẽ tự động sang màn hình thành công dù mạng có lỗi
            const safetyTimer = setTimeout(() => {
                if (!isFinished) {
                    isFinished = true;
                    step2.style.display = 'none';
                    step3.style.display = 'block';
                }
            }, 3000);

            emailjs.send('service_pmb4r1n', 'template_ftoh0oj', templateParams)
                .then(function(response) {
                    if (!isFinished) {
                        isFinished = true;
                        clearTimeout(safetyTimer);
                        step2.style.display = 'none';
                        step3.style.display = 'block';
                    }
                }, function(error) {
                    if (!isFinished) {
                        isFinished = true;
                        clearTimeout(safetyTimer);
                        step2.style.display = 'none';
                        step3.style.display = 'block';
                    }
                });
        });

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                document.body.appendChild(heart);

                setTimeout(() => { heart.remove(); }, 4000);
            }, 300);
        }
    </script>
</body>
</html>
